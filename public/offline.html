<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline | ServeBiz</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f6; color: #1b2420; }
  main { max-width: 420px; padding: 24px; text-align: center; }
  a, button { display: inline-block; margin-top: 16px; padding: 10px 18px; border-radius: 10px; border: 0; background: #0f6b57; color: #fff; font: inherit; text-decoration: none; cursor: pointer; }
  p { color: #55625c; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>This page needs a connection. The point of sale keeps working offline if you opened it while online at least once on this device: cash sales are saved here and sent when you are back online.</p>
  <a href="/pos">Open the point of sale</a><br>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
